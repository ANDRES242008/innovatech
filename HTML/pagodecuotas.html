<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finalizar compra | INNOVATECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="shortcut icon" href="../assets/images/logos/in.png" type="image/x-icon">
    <link rel="stylesheet" href="../CSS/pagodecuotas.css" />
    <style>
        .aviso-demo { background: #fff8e1; border-left: 4px solid #f5a623; padding: 14px 18px; border-radius: 8px; margin: 20px 0; line-height: 1.5; }
        .resumen { list-style: none; padding: 0; margin: 20px 0; }
        .resumen li { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid #e5e7eb; }
        .resumen-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.2rem; margin: 16px 0 24px; }
    </style>
</head>
<body>
<main class="cuota-pago">
    <button class="btn-volver" onclick="window.location.href='carrito.html';">&larr; Volver al carrito</button>
    <h2 class="cuota-titulo">Finalizar compra</h2>

    <div class="aviso-demo" role="note">
        <strong>Proyecto demostrativo.</strong> Esta tienda no procesa pagos reales ni solicita datos bancarios.
        La integración de pagos seguros está planificada para una próxima versión.
    </div>

    <ul class="resumen" id="resumen"></ul>
    <div class="resumen-total"><span>Total</span><span id="total">$0.00</span></div>

    <button class="btn-accion" id="btn-simular" style="width:100%;">Simular compra</button>
</main>

<script>
    (function () {
        const lista = document.getElementById('resumen');
        const totalEl = document.getElementById('total');
        const boton = document.getElementById('btn-simular');

        let carrito = [];
        try { carrito = JSON.parse(localStorage.getItem('shoppingCart')) || []; } catch (e) { carrito = []; }

        const precio = (item) => parseFloat(String(item.priceDescuento || item.price || '0').replace(/[^0-9.]/g, '')) || 0;

        if (carrito.length === 0) {
            lista.innerHTML = '<li>Tu carrito está vacío.</li>';
            boton.disabled = true;
            return;
        }

        let total = 0;
        carrito.forEach((item) => {
            const subtotal = precio(item) * (item.quantity || 1);
            total += subtotal;
            const li = document.createElement('li');
            const nombre = document.createElement('span');
            nombre.textContent = `${item.quantity || 1} × ${item.name || 'Producto'}`;
            const monto = document.createElement('span');
            monto.textContent = `$${subtotal.toFixed(2)}`;
            li.append(nombre, monto);
            lista.appendChild(li);
        });
        totalEl.textContent = `$${total.toFixed(2)}`;

        boton.addEventListener('click', () => {
            localStorage.removeItem('shoppingCart');
            document.querySelector('.cuota-pago').innerHTML = `
                <h2 class="cuota-titulo">¡Compra simulada con éxito!</h2>
                <p class="cuota-descripcion">No se realizó ningún cargo. Gracias por probar INNOVATECH.</p>
                <button class="btn-accion" onclick="window.location.href='index.html';">Volver al inicio</button>`;
        });
    })();
</script>
</body>
</html>
