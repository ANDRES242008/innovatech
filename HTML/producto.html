<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Producto | INNOVATECH</title>
  <meta name="description" content="Detalle de producto en INNOVATECH, tienda de tecnología." />
  <link rel="stylesheet" href="../CSS/celulares.css" />
  <link rel="shortcut icon" href="../assets/images/logos/in.png" type="image/png">
  <style>
    .estado { text-align: center; padding: 80px 20px; font-size: 18px; }
    .estado a { color: #007bff; }
    #color-selection[hidden] { display: none; }
  </style>
</head>
<body>
  <div data-layout="encabezado"></div>
  <script src="../JS/layout.js"></script>

  <main>
    <nav class="breadcrumb" aria-label="Ruta de navegación">
      <a href="index.html">Inicio</a> &gt;
      <a id="breadcrumb-categoria" href="index.html">Categoría</a> &gt;
      <span id="product-name-breadcrumb">Producto</span>
    </nav>

    <p id="estado" class="estado">Cargando producto…</p>

    <section class="product-detail" id="detalle" hidden>
      <div class="image-gallery">
        <div class="main-image-container">
          <img id="product-image" class="product-image" src="" alt="" />
        </div>
      </div>

      <div class="product-info" style="gap: 20px;">
        <div class="product-info-left" style="flex: 1 1 60%;">
          <h1 id="product-name">Producto</h1>
          <div>
            <span class="price-original" id="price-original"></span>
            <span class="price-descuento" id="price-descuento"></span>
          </div>

          <div id="color-selection" style="margin: 15px 0; text-align: center;" hidden>
            <span style="font-weight: 600; font-size: 16px; display: block; margin-bottom: 10px;">Color:</span>
            <div class="color-selector" id="color-buttons" style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;"></div>
          </div>

          <div style="margin-top: 15px;">
            <label for="quantity-input" style="font-weight: 600; font-size: 16px; display: block; margin-bottom: 6px;">Cantidad:</label>
            <input type="number" id="quantity-input" value="1" min="1" max="99" style="width: 100px; padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px; display: block;" />
            <button class="btn-carrito" id="add-to-cart-btn" style="width: 100%; padding: 14px 0; font-size: 18px; border-radius: 6px;">Agregar al carrito</button>
          </div>

          <div class="specs-container" aria-label="Especificaciones del producto" style="margin-top: 20px;">
            <button type="button" class="specs-header" id="specs-toggle" aria-expanded="true" aria-controls="specs-body" style="all: unset; cursor: pointer; display: block; width: 100%;">
              <h2>Especificaciones técnicas</h2>
            </button>
            <div class="specs-grid" id="specs-body"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div data-layout="pie"></div>

  <script src="../JS/catalogo.js"></script>
  <script src="../JS/carrito.js"></script>
  <script src="../JS/buscador.js"></script>

  <script>
    (function () {
      // Colores conocidos para los botones de color
      const COLORES = {
        blanco: '#ffffff', negro: '#1b1b1a', azul: '#1e5bd8', morado: '#7b3fbf',
        rojo: '#d62828', gris: '#8a8a8a', plata: '#c0c0c0', dorado: '#d4af37',
        verde: '#2a9d4b', rosa: '#f4a6c1', amarillo: '#f2c230'
      };

      const $ = (id) => document.getElementById(id);
      const dinero = (n) => Catalogo.dinero(n);

      function mostrarError(mensaje) {
        $('estado').innerHTML = mensaje + '<br><br><a href="index.html">Volver al inicio</a>';
        $('estado').hidden = false;
        $('detalle').hidden = true;
      }

      function renderColores(producto) {
        const colores = Object.keys(producto.imagenes || {});
        if (colores.length < 2) return;

        const contenedor = $('color-buttons');
        colores.forEach((color, i) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'color-btn' + (i === 0 ? ' selected' : '');
          btn.style.backgroundColor = COLORES[color.toLowerCase()] || '#dddddd';
          btn.title = color.charAt(0).toUpperCase() + color.slice(1);
          btn.setAttribute('aria-label', 'Color ' + color);
          btn.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
          btn.addEventListener('click', () => {
            $('product-image').src = producto.imagenes[color];
            contenedor.querySelectorAll('.color-btn').forEach((b) => {
              b.classList.remove('selected');
              b.setAttribute('aria-pressed', 'false');
            });
            btn.classList.add('selected');
            btn.setAttribute('aria-pressed', 'true');
          });
          contenedor.appendChild(btn);
        });
        $('color-selection').hidden = false;
      }

      function renderSpecs(especificaciones) {
        const cuerpo = $('specs-body');
        for (const [nombre, valor] of Object.entries(especificaciones || {})) {
          const item = document.createElement('div');
          item.className = 'specs-item';
          const n = document.createElement('div');
          n.className = 'specs-name';
          n.textContent = nombre;
          const v = document.createElement('div');
          v.className = 'specs-value';
          v.textContent = valor;
          item.append(n, v);
          cuerpo.appendChild(item);
        }
      }

      function render(producto, categoria) {
        document.title = `${producto.nombre} | INNOVATECH`;
        document.querySelector('meta[name="description"]').content =
          `${producto.nombre} a ${dinero(producto.precio)} en INNOVATECH.`;

        $('product-name').textContent = producto.nombre;
        $('product-name-breadcrumb').textContent = producto.nombre;
        if (categoria) {
          $('breadcrumb-categoria').textContent = categoria.nombre;
          $('breadcrumb-categoria').href = categoria.pagina;
        }

        $('price-descuento').textContent = dinero(producto.precio);
        if (producto.precioOriginal && producto.precioOriginal > producto.precio) {
          $('price-original').textContent = dinero(producto.precioOriginal);
        }

        const primera = Object.values(producto.imagenes || {})[0] || producto.imagen;
        $('product-image').src = primera;
        $('product-image').alt = producto.nombre;

        renderColores(producto);
        renderSpecs(producto.especificaciones);

        $('estado').hidden = true;
        $('detalle').hidden = false;

        $('add-to-cart-btn').addEventListener('click', () => {
          let cantidad = parseInt($('quantity-input').value, 10);
          if (isNaN(cantidad) || cantidad < 1) cantidad = 1;
          window.cart.agregar(producto.id, cantidad, $('product-image').getAttribute('src'));
        });
      }

      // Mostrar/ocultar especificaciones
      $('specs-toggle').addEventListener('click', () => {
        const abierto = $('specs-toggle').getAttribute('aria-expanded') === 'true';
        $('specs-body').style.display = abierto ? 'none' : 'grid';
        $('specs-toggle').setAttribute('aria-expanded', String(!abierto));
      });

      // Cargar producto
      const id = parseInt(new URLSearchParams(location.search).get('id'), 10);
      if (!id) {
        mostrarError('Producto no especificado.');
        return;
      }

      Catalogo.cargar()
        .then((datos) => {
          const producto = datos.productos.find((p) => p.id === id);
          if (!producto) {
            mostrarError('Producto no encontrado.');
            return;
          }
          const categoria = datos.categorias.find((c) => c.id === producto.categoria);
          render(producto, categoria);
        })
        .catch(() => mostrarError('No se pudo cargar el catálogo. Abre el sitio con Live Server.'));
    })();
  </script>
</body>
</html>
